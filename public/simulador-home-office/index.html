<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Home Office no Litoral — Praia Digital</title>
<meta name="description" content="Quanto você economiza por ano trabalhando de casa na praia em vez de morar em São Paulo?">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:680px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.3rem}
  .linha{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #e2e8f0;font-size:.93rem}
  .linha b{color:#166534}
  .destaque{background:#dcfce7;border:1px solid #22c55e;border-radius:12px;padding:1.1rem;margin-top:.8rem;text-align:center}
  .destaque b{font-size:1.5rem;color:#166534;display:block}
  .dica{margin-top:1rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/apps">Rede de apps →</a>
</header>
<main>
  <div class="card">
    <h1>🏝️ Calculadora Home Office na Praia</h1>
    <p class="sub">Compare o custo de vida: capital vs litoral, trabalhando remoto.</p>
    <label>Aluguel atual na capital (R$/mês)</label><input type="number" id="aluguel" value="3200">
    <label>Aluguel estimado no litoral (R$/mês)</label><input type="number" id="aluguelL" value="2000">
    <label>Transporte/combustível na capital (R$/mês)</label><input type="number" id="transp" value="600">
    <label>Alimentação fora/delivery na capital (R$/mês)</label><input type="number" id="food" value="900">
    <button onclick="calc()">Calcular economia anual</button>
    <div id="out"></div>
    <div class="dica">📦 Planeje a mudança no <a href="https://praia.digital/praiadigital-site/checklist-mudanca/" style="color:#0077B6;font-weight:700">Checklist de Mudança</a> · 🎯 <a href="https://praia.digital/praiadigital-site/quiz-imovel-ideal/" style="color:#0077B6;font-weight:700">Quiz Imóvel Ideal</a></div>
  </div>
</main>
<script>
var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
function calc(){
  var a=parseFloat(document.getElementById('aluguel').value)||0;
  var al=parseFloat(document.getElementById('aluguelL').value)||0;
  var t=parseFloat(document.getElementById('transp').value)||0;
  var f=parseFloat(document.getElementById('food').value)||0;
  var ecoMes=(a-al)+t+(f*0.4); // cozinhar mais em casa ~40% menos
  var ecoAno=ecoMes*12;
  document.getElementById('out').innerHTML=
    '<div class="linha"><span>Economia no aluguel</span><b>'+fmt(a-al)+'/mês</b></div>'+
    '<div class="linha"><span>Economia em transporte</span><b>'+fmt(t)+'/mês</b></div>'+
    '<div class="linha"><span>Economia em alimentação</span><b>'+fmt(f*0.4)+'/mês</b></div>'+
    '<div class="destaque">Economia anual estimada<b>'+fmt(ecoAno)+'</b><small>Em 5 anos: '+fmt(ecoAno*5)+' — dá para a entrada de um imóvel no litoral!</small></div>';
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
