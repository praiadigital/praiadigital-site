<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Perfil de Investidor — Praia Digital</title>
<meta name="description" content="Descubra seu perfil de investidor imobiliário no litoral e a estratégia recomendada.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:640px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.25rem;font-size:.95rem}
  .step{display:none}.step.active{display:block}
  .q{font-weight:700;margin-bottom:.8rem}
  .opt{display:block;width:100%;text-align:left;padding:.85rem 1rem;margin-bottom:.5rem;border:1px solid #cbd5e1;border-radius:12px;background:#fff;cursor:pointer;font-size:1rem}
  .opt:hover{border-color:#0077B6;background:#f0f9ff}
  .barra{height:6px;background:#e2e8f0;border-radius:99px;margin-bottom:1.25rem;overflow:hidden}
  .barra div{height:100%;background:linear-gradient(90deg,#0077B6,#00B4D8);transition:width .3s}
  #res{display:none}
  .perfil{background:#ecfeff;border:1px solid #67e8f9;border-radius:14px;padding:1.25rem;text-align:center}
  .perfil b{font-size:1.2rem;color:#0369a1}
  .ctas{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap;justify-content:center}
  .cta{padding:.7rem 1.2rem;border-radius:10px;text-decoration:none;font-weight:700;font-size:.9rem;background:#0077B6;color:#fff}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/apps">Rede de apps →</a>
</header>
<main>
  <div class="card">
    <h1>📊 Quiz: Perfil de Investidor</h1>
    <p class="sub">Descubra sua estratégia ideal de investimento no litoral.</p>
    <div class="barra"><div id="bar" style="width:33%"></div></div>
    <div class="step active" data-s="0">
      <p class="q">1. Capital disponível?</p>
      <button class="opt" onclick="r(0,'p')">Até R$ 300 mil</button>
      <button class="opt" onclick="r(0,'m')">R$ 300–700 mil</button>
      <button class="opt" onclick="r(0,'g')">Acima de R$ 700 mil</button>
    </div>
    <div class="step" data-s="1">
      <p class="q">2. Você prefere...</p>
      <button class="opt" onclick="r(1,'renda')">💵 Renda mensal recorrente</button>
      <button class="opt" onclick="r(1,'ganho')">📈 Ganho de capital no longo prazo</button>
    </div>
    <div class="step" data-s="2">
      <p class="q">3. Quanto trabalho aceita ter?</p>
      <button class="opt" onclick="r(2,'ativo')">🛠️ Gestão ativa (máximo retorno)</button>
      <button class="opt" onclick="r(2,'passivo')">😎 Renda passiva (mínimo esforço)</button>
    </div>
    <div id="res">
      <div class="perfil">
        <p>Seu perfil de investidor:</p>
        <b id="pNome"></b>
        <p id="pDesc" style="margin-top:.5rem;font-size:.95rem"></p>
        <div class="ctas">
          <a class="cta" id="cta1" href="#">Simular retorno →</a>
          <a class="cta" href="https://praia.digital/guia-litoral/ranking-cidades/">Ver ranking de cidades</a>
        </div>
      </div>
      <p style="text-align:center;margin-top:1rem"><a href="javascript:location.reload()" style="color:#64748b;font-size:.85rem">Refazer quiz</a></p>
    </div>
  </div>
</main>
<script>
var resp_={};
function r(s,v){
  resp_[s]=v;
  document.querySelectorAll('.step').forEach(function(e){e.classList.remove('active')});
  var n=document.querySelector('.step[data-s="'+(s+1)+'"]');
  document.getElementById('bar').style.width=((s+2)/3*100)+'%';
  if(n){n.classList.add('active');return;}
  var nome,desc,cta;
  if(resp_[1]==='renda'&&resp_[2]==='ativo'){nome='🏖️ Investidor de Temporada';desc='Compre apartamento compacto em Praia Grande ou Guarujá e opere no Airbnb. Retorno alvo: 8–12% ao ano. Gestão ativa multiplica o resultado.';cta='https://praia.digital/simulador-roi/airbnb-vs-anual/';}
  else if(resp_[1]==='renda'){nome='📄 Investidor de Renda Passiva';desc='Aluguel anual em Santos ou São Vicente: mercado local forte, vacância baixa e zero operação de temporada.';cta='https://praia.digital/simulador-roi';}
  else if(resp_[0]==='g'){nome='💎 Investidor Premium';desc='Casas em Riviera de São Lourenço (Bertioga): maior valorização do litoral (14,5%/ano) com perfil de cliente de alto poder aquisitivo.';cta='https://praia.digital/avaliador-imoveis/projecao-valorizacao/';}
  else{nome='🌱 Investidor Frontier';desc='Peruíbe e Itanhaém: entrada barata (m² abaixo de R$ 4.500) e valorização acima de 12%/ano. Horizonte de 5–10 anos.';cta='https://praia.digital/avaliador-imoveis/projecao-valorizacao/';}
  document.getElementById('pNome').textContent=nome;
  document.getElementById('pDesc').textContent=desc;
  document.getElementById('cta1').href=cta;
  document.getElementById('res').style.display='block';
}
</script>
</body>
</html>
