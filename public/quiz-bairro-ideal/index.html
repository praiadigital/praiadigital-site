<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Bairro Ideal para Morar — Praia Digital</title>
<meta name="description" content="Responda 3 perguntas e descubra o bairro ideal para morar no litoral paulista conforme seu estilo de vida.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:640px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.25rem;font-size:.95rem}
  .step{display:none}.step.active{display:block}
  .q{font-weight:700;margin-bottom:.8rem}
  .opt{display:block;width:100%;text-align:left;padding:.85rem 1rem;margin-bottom:.5rem;border:1px solid #cbd5e1;border-radius:12px;background:#fff;cursor:pointer;font-size:1rem}
  .opt:hover{border-color:#0077B6;background:#f0f9ff}
  .barra{height:6px;background:#e2e8f0;border-radius:99px;margin-bottom:1.25rem;overflow:hidden}
  .barra div{height:100%;background:linear-gradient(90deg,#0077B6,#00B4D8);transition:width .3s}
  #res{display:none}
  .bairro{background:linear-gradient(135deg,#ecfeff,#f0f9ff);border:1px solid #67e8f9;border-radius:14px;padding:1.4rem;text-align:center}
  .bairro b{font-size:1.25rem;color:#0369a1;display:block;margin:.4rem 0}
  .cta{display:inline-block;margin-top:.9rem;padding:.75rem 1.4rem;border-radius:10px;background:#25d366;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/apps">Rede de apps →</a>
</header>
<main>
  <div class="card">
    <h1>🏡 Quiz: Seu Bairro Ideal</h1>
    <p class="sub">3 perguntas para achar o bairro perfeito para morar no litoral.</p>
    <div class="barra"><div id="bar" style="width:33%"></div></div>
    <div class="step active" data-s="0">
      <p class="q">1. Sua prioridade número 1:</p>
      <button class="opt" onclick="r(0,'praia')">🌊 Viver a poucos passos da praia</button>
      <button class="opt" onclick="r(0,'custo')">💰 Melhor custo-benefício</button>
      <button class="opt" onclick="r(0,'servicos')">🏥 Serviços e conveniência</button>
    </div>
    <div class="step" data-s="1">
      <p class="q">2. Sua rotina ideal:</p>
      <button class="opt" onclick="r(1,'calmo')">🧘 Tranquila e silenciosa</button>
      <button class="opt" onclick="r(1,'movimento')">🎉 Com movimento e vida noturna</button>
    </div>
    <div class="step" data-s="2">
      <p class="q">3. Trabalho:</p>
      <button class="opt" onclick="r(2,'remoto')">💻 Remoto — moro onde quiser</button>
      <button class="opt" onclick="r(2,'sp')">🚗 Preciso ir a SP às vezes</button>
    </div>
    <div id="res">
      <div class="bairro">
        <p>Seu bairro ideal:</p>
        <b id="nome"></b>
        <p id="desc" style="font-size:.95rem;color:#475569"></p>
        <a class="cta" id="cta" href="#" target="_blank" rel="noopener">Ver imóveis no bairro →</a>
      </div>
      <p style="text-align:center;margin-top:1rem"><a href="javascript:location.reload()" style="color:#64748b;font-size:.85rem">Refazer</a></p>
    </div>
  </div>
</main>
<script>
var resp_={};
function r(s,v){
  resp_[s]=v;
  document.querySelectorAll('.step').forEach(function(e){e.classList.remove('active')});
  var n=document.querySelector('.step[data-s="'+(s+1)+'"]');
  document.getElementById('bar').style.width=((s+2)/3*100)+'%';
  if(n){n.classList.add('active');return;}
  var nome,desc;
  if(resp_[0]==='praia'&&resp_[1]==='movimento'){nome='Gonzaga, Santos';desc='A poucos passos da praia, com restaurantes, mercados e a vida urbana mais completa do litoral.';}
  else if(resp_[0]==='praia'&&resp_[1]==='calmo'){nome='Balneário Flórida, Praia Grande';desc='Tranquilo, pertinho do mar e com preços amigáveis. Ideal para home office com qualidade de vida.';}
  else if(resp_[0]==='custo'){nome='Centro de Mongaguá';desc='O melhor custo por m² da Baixada, com todo o comércio a pé e praia a minutos.';}
  else if(resp_[2]==='sp'){nome='Gonzaguinha, São Vicente';desc='Acesso rápido à Via Anchieta, orla urbanizada e mercado imobiliário líquido.';}
  else{nome='Riviera de São Lourenço, Bertioga';desc='Condomínio-planejado completo: segurança, lazer e a praia mais bem cuidada da região.';}
  document.getElementById('nome').textContent=nome;
  document.getElementById('desc').textContent=desc;
  document.getElementById('cta').href='https://wa.me/5511954346288?text='+encodeURIComponent('Meu quiz deu: '+nome+'. Quero conhecer imóveis!');
  document.getElementById('res').style.display='block';
}
</script>
</body>
</html>
